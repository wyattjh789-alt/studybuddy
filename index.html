<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy - Your Google Classroom Study Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // YOUR CREDENTIALS - ALREADY CONFIGURED!
        const SUPABASE_URL = 'https://ouuzqkkytjdlewraptxk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91dXpxa2t5dGpkbGV3cmFwdHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3Mzk4ODgsImV4cCI6MjA4MzMxNTg4OH0.Lh5MleKkYfeLnViX6Je239qvVmYuXuncjT13QzVSFKQ';
        const GOOGLE_CLIENT_ID = '677818493132-t9uu1v6el1f4bn46gl6gbu635a7flhra.apps.googleusercontent.com';
        const REDIRECT_URI = window.location.origin;

        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const SCOPES = [
            'https://www.googleapis.com/auth/classroom.courses.readonly',
            'https://www.googleapis.com/auth/classroom.coursework.me.readonly'
        ].join(' ');

        function StudyBuddy() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [hasGoogleAuth, setHasGoogleAuth] = useState(false);
            const [showSignup, setShowSignup] = useState(false);
            const [courses, setCourses] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [selectedCourse, setSelectedCourse] = useState('all');
            const [formData, setFormData] = useState({ name: '', email: '', password: '' });
            const [error, setError] = useState('');

            useEffect(() => {
                checkUser();
                checkGoogleCallback();
            }, []);

            const checkUser = async () => {
                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session?.user) {
                        setUser(session.user);
                        checkGoogleAuth();
                    }
                } catch (err) {
                    console.error('Session error:', err);
                }
                setLoading(false);
            };

            const checkGoogleAuth = () => {
                const token = localStorage.getItem('google_token');
                if (token) {
                    setHasGoogleAuth(true);
                    loadClassroomData(token);
                }
            };

            const checkGoogleCallback = () => {
                const hash = window.location.hash;
                if (hash.includes('access_token')) {
                    const params = new URLSearchParams(hash.substring(1));
                    const token = params.get('access_token');
                    if (token) {
                        localStorage.setItem('google_token', token);
                        setHasGoogleAuth(true);
                        loadClassroomData(token);
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            };

            const handleSignup = async () => {
                try {
                    setError('');
                    if (!formData.email || !formData.password || !formData.name) {
                        setError('Please fill all fields');
                        return;
                    }
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: formData.email,
                        password: formData.password,
                        options: { data: { name: formData.name } }
                    });
                    if (error) throw error;
                    if (data.user) {
                        setUser(data.user);
                        setShowSignup(false);
                    }
                } catch (err) {
                    setError(err.message);
                }
            };

            const handleLogin = async () => {
                try {
                    setError('');
                    if (!formData.email || !formData.password) {
                        setError('Please enter credentials');
                        return;
                    }
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: formData.email,
                        password: formData.password
                    });
                    if (error) throw error;
                    if (data.user) setUser(data.user);
                } catch (err) {
                    setError(err.message);
                }
            };

            const handleGoogleAuth = () => {
                const url = `https://accounts.google.com/o/oauth2/v2/auth?` +
                    `client_id=${GOOGLE_CLIENT_ID}` +
                    `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                    `&response_type=token` +
                    `&scope=${encodeURIComponent(SCOPES)}`;
                window.location.href = url;
            };

            const loadClassroomData = async (token) => {
                try {
                    const res = await fetch('https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    
                    if (data.courses) {
                        setCourses(data.courses.map(c => ({
                            id: c.id,
                            name: c.name,
                            teacher: c.teacherFolder?.title || 'Teacher'
                        })));

                        const allAssignments = [];
                        for (const course of data.courses) {
                            try {
                                const aRes = await fetch(
                                    `https://classroom.googleapis.com/v1/courses/${course.id}/courseWork`,
                                    { headers: { 'Authorization': `Bearer ${token}` } }
                                );
                                const aData = await aRes.json();
                                
                                if (aData.courseWork) {
                                    aData.courseWork.forEach(w => {
                                        let due = null;
                                        if (w.dueDate) {
                                            due = `${w.dueDate.year}-${String(w.dueDate.month).padStart(2,'0')}-${String(w.dueDate.day).padStart(2,'0')}`;
                                        }
                                        allAssignments.push({
                                            id: w.id,
                                            courseId: course.id,
                                            courseName: course.name,
                                            title: w.title,
                                            description: w.description || 'No description',
                                            dueDate: due,
                                            status: 'pending',
                                            link: w.alternateLink
                                        });
                                    });
                                }
                            } catch (e) {
                                console.error('Assignment load error:', e);
                            }
                        }
                        setAssignments(allAssignments.sort((a,b) => {
                            if (!a.dueDate) return 1;
                            if (!b.dueDate) return -1;
                            return new Date(a.dueDate) - new Date(b.dueDate);
                        }));
                    }
                } catch (err) {
                    console.error('Classroom load error:', err);
                    setError('Failed to load data');
                }
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                localStorage.removeItem('google_token');
                setUser(null);
                setHasGoogleAuth(false);
                setCourses([]);
                setAssignments([]);
            };

            const toggleComplete = (id) => {
                setAssignments(assignments.map(a =>
                    a.id === id ? { ...a, status: a.status === 'completed' ? 'pending' : 'completed' } : a
                ));
            };

            const filtered = selectedCourse === 'all' ? assignments : assignments.filter(a => a.courseId === selectedCourse);

            const getDaysUntil = (date) => {
                if (!date) return 999;
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(date);
                due.setHours(0,0,0,0);
                return Math.ceil((due - today) / (1000*60*60*24));
            };

            const getColor = (days) => {
                if (days < 0) return 'bg-red-100 text-red-800';
                if (days === 0) return 'bg-orange-100 text-orange-800';
                if (days <= 2) return 'bg-orange-100 text-orange-800';
                if (days <= 5) return 'bg-yellow-100 text-yellow-800';
                return 'bg-green-100 text-green-800';
            };

            const getLabel = (days) => {
                if (days < 0) return `${Math.abs(days)}d overdue`;
                if (days === 0) return 'Due today';
                if (days === 1) return 'Due tomorrow';
                return `${days} days left`;
            };

            const stats = {
                total: assignments.length,
                pending: assignments.filter(a => a.status === 'pending').length,
                completed: assignments.filter(a => a.status === 'completed').length
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-xl text-gray-700">Loading Study Buddy...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="w-20 h-20 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <span className="text-white text-3xl font-bold">SB</span>
                                </div>
                                <h1 className="text-4xl font-bold text-gray-900 mb-2">Study Buddy</h1>
                                <p className="text-gray-600">Your Google Classroom companion</p>
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
                                    {error}
                                </div>
                            )}

                            {showSignup ? (
                                <div className="space-y-4">
                                    <h2 className="text-2xl font-semibold mb-4">Create Account</h2>
                                    <input
                                        type="text"
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Full Name"
                                    />
                                    <input
                                        type="email"
                                        value={formData.email}
                                        onChange={(e) => setFormData({...formData, email: e.target.value})}
                                        className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Email"
                                    />
                                    <input
                                        type="password"
                                        value={formData.password}
                                        onChange={(e) => setFormData({...formData, password: e.target.value})}
                                        className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Password"
                                    />
                                    <button
                                        onClick={handleSignup}
                                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700"
                                    >
                                        Sign Up
                                    </button>
                                    <button
                                        onClick={() => setShowSignup(false)}
                                        className="w-full text-indigo-600 py-2 text-sm hover:underline"
                                    >
                                        Already have an account? Log in
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <h2 className="text-2xl font-semibold mb-4">Log In</h2>
                                    <input
                                        type="email"
                                        value={formData.email}
                                        onChange={(e) => setFormData({...formData, email: e.target.value})}
                                        className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Email"
                                    />
                                    <input
                                        type="password"
                                        value={formData.password}
                                        onChange={(e) => setFormData({...formData, password: e.target.value})}
                                        className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        placeholder="Password"
                                    />
                                    <button
                                        onClick={handleLogin}
                                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700"
                                    >
                                        Log In
                                    </button>
                                    <button
                                        onClick={() => setShowSignup(true)}
                                        className="w-full text-indigo-600 py-2 text-sm hover:underline"
                                    >
                                        Don't have an account? Sign up
                                    </button>
                                </div>
                            )}
                            <div className="mt-6 text-center text-xs text-gray-500">
                                Free forever • No credit card required
                            </div>
                        </div>
                    </div>
                );
            }

            if (!hasGoogleAuth) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="w-20 h-20 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <span className="text-white text-3xl font-bold">SB</span>
                                </div>
                                <h1 className="text-2xl font-bold mb-2">Connect Google Classroom</h1>
                                <p className="text-gray-600">Sync your assignments automatically</p>
                            </div>

                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
                                <h3 className="font-semibold text-blue-900 mb-2">What we'll access:</h3>
                                <ul className="text-sm text-blue-800 space-y-1">
                                    <li>• Your courses</li>
                                    <li>• Assignment titles and due dates</li>
                                    <li>• Submission status</li>
                                </ul>
                                <p className="text-xs text-blue-700 mt-2">We never modify your data</p>
                            </div>

                            <button
                                onClick={handleGoogleAuth}
                                className="w-full bg-white border-2 border-gray-300 py-3 px-4 rounded-lg font-semibold hover:bg-gray-50 flex items-center justify-center gap-3"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Connect with Google
                            </button>

                            <button onClick={handleLogout} className="w-full text-gray-600 py-2 mt-4 text-sm hover:underline">
                                Log out
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center">
                                    <span className="text-white font-bold">SB</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">Study Buddy</h1>
                                    <p className="text-xs text-gray-500">studybuddyapp.xyz</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <span className="text-sm text-gray-600 hidden sm:block">{user.email}</span>
                                <button
                                    onClick={handleLogout}
                                    className="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 text-sm font-medium"
                                >
                                    Logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-white rounded-xl shadow p-6">
                                <p className="text-gray-600 text-sm mb-1">Total Assignments</p>
                                <p className="text-4xl font-bold text-gray-900">{stats.total}</p>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6">
                                <p className="text-gray-600 text-sm mb-1">Pending</p>
                                <p className="text-4xl font-bold text-orange-600">{stats.pending}</p>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6">
                                <p className="text-gray-600 text-sm mb-1">Completed</p>
                                <p className="text-4xl font-bold text-green-600">{stats.completed}</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow p-4 mb-6">
                            <label className="block text-sm font-medium text-gray-700 mb-2">Filter by Course</label>
                            <select
                                value={selectedCourse}
                                onChange={(e) => setSelectedCourse(e.target.value)}
                                className="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg"
                            >
                                <option value="all">All Courses</option>
                                {courses.map(c => (
                                    <option key={c.id} value={c.id}>{c.name}</option>
                                ))}
                            </select>
                        </div>

                        <div className="space-y-4">
                            <h2 className="text-xl font-bold text-gray-900">Your Assignments</h2>
                            {filtered.length === 0 ? (
                                <div className="bg-white rounded-xl shadow p-12 text-center">
                                    <div className="text-6xl mb-4">📚</div>
                                    <p className="text-gray-600">No assignments found</p>
                                    <p className="text-sm text-gray-500 mt-2">Connect your Google Classroom to see assignments</p>
                                </div>
                            ) : (
                                filtered.map(a => {
                                    const days = getDaysUntil(a.dueDate);
                                    return (
                                        <div key={a.id} className="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
                                            <div className="flex items-start justify-between gap-4">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-3 mb-2">
                                                        <h3 className="text-lg font-semibold text-gray-900">{a.title}</h3>
                                                        {a.status === 'completed' && (
                                                            <span className="text-green-600 text-xl">✓</span>
                                                        )}
                                                    </div>
                                                    <p className="text-sm text-indigo-600 font-medium mb-2">{a.courseName}</p>
                                                    <p className="text-gray-700 mb-3">{a.description}</p>
                                                    {a.dueDate && (
                                                        <div className="flex items-center gap-3 flex-wrap">
                                                            <span className={`px-3 py-1 rounded-full text-sm font-medium ${getColor(days)}`}>
                                                                {getLabel(days)}
                                                            </span>
                                                            <span className="text-sm text-gray-600">
                                                                Due: {new Date(a.dueDate).toLocaleDateString()}
                                                            </span>
                                                        </div>
                                                    )}
                                                    {a.link && (
                                                        <a
                                                            href={a.link}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="text-sm text-indigo-600 hover:underline mt-2 inline-block"
                                                        >
                                                            Open in Classroom →
                                                        </a>
                                                    )}
                                                </div>
                                                <button
                                                    onClick={() => toggleComplete(a.id)}
                                                    className={`px-4 py-2 rounded-lg font-medium transition whitespace-nowrap ${
                                                        a.status === 'completed'
                                                            ? 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                                            : 'bg-indigo-600 text-white hover:bg-indigo-700'
                                                    }`}
                                                >
                                                    {a.status === 'completed' ? 'Undo' : 'Complete'}
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<StudyBuddy />, document.getElementById('root'));
    </script>
</body>
</html>
