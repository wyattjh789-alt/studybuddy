<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy - Your Google Classroom Study Assistant</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        const SUPABASE_URL = 'https://ouuzqkkytjdlewraptxk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91dXpxa2t5dGpkbGV3cmFwdHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3Mzk4ODgsImV4cCI6MjA4MzMxNTg4OH0.Lh5MleKkYfeLnViX6Je239qvVmYuXuncjT13QzVSFKQ';
        const GOOGLE_CLIENT_ID = '677818493132-t9uu1v6el1f4bn46gl6gbu635a7flhra.apps.googleusercontent.com';
        const REDIRECT_URI = window.location.origin;

        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const SCOPES = [
            'https://www.googleapis.com/auth/classroom.courses.readonly',
            'https://www.googleapis.com/auth/classroom.coursework.me.readonly',
            'https://www.googleapis.com/auth/classroom.courseworkmaterials.readonly'
        ].join(' ');

        function StudyBuddy() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [hasGoogleAuth, setHasGoogleAuth] = useState(false);
            const [showSignup, setShowSignup] = useState(false);
            const [courses, setCourses] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [selectedCourse, setSelectedCourse] = useState('all');
            const [formData, setFormData] = useState({ name: '', email: '', password: '' });
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');

            useEffect(() => {
                initializeAuth();
            }, []);

            const initializeAuth = async () => {
                try {
                    // Check for Google OAuth callback first
                    const hash = window.location.hash;
                    if (hash.includes('access_token')) {
                        const params = new URLSearchParams(hash.substring(1));
                        const token = params.get('access_token');
                        if (token) {
                            localStorage.setItem('google_token', token);
                            window.history.replaceState({}, document.title, window.location.pathname);
                        }
                    }

                    // Check for existing Supabase session
                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    
                    if (error) {
                        console.error('Session error:', error);
                    }

                    if (session?.user) {
                        console.log('User session found:', session.user.email);
                        setUser(session.user);
                        
                        // Check for Google token
                        const googleToken = localStorage.getItem('google_token');
                        if (googleToken) {
                            setHasGoogleAuth(true);
                            await loadClassroomData(googleToken);
                        }
                    }
                } catch (err) {
                    console.error('Init error:', err);
                }
                setLoading(false);
            };

            const handleSignup = async () => {
                try {
                    setError('');
                    setSuccess('');
                    
                    if (!formData.name || !formData.email || !formData.password) {
                        setError('Please fill in all fields');
                        return;
                    }

                    if (formData.password.length < 6) {
                        setError('Password must be at least 6 characters');
                        return;
                    }

                    console.log('Signing up:', formData.email);

                    const { data, error } = await supabaseClient.auth.signUp({
                        email: formData.email,
                        password: formData.password,
                        options: {
                            data: {
                                name: formData.name
                            }
                        }
                    });

                    if (error) {
                        console.error('Signup error:', error);
                        throw error;
                    }

                    console.log('Signup response:', data);

                    if (data.user) {
                        // Check if email confirmation is required
                        if (data.user.identities && data.user.identities.length === 0) {
                            setSuccess('Please check your email to confirm your account!');
                            setFormData({ name: '', email: '', password: '' });
                        } else {
                            // Auto-login if no confirmation needed
                            setUser(data.user);
                            setShowSignup(false);
                            setSuccess('Account created successfully!');
                        }
                    }
                } catch (err) {
                    setError(err.message || 'Signup failed. Please try again.');
                }
            };

            const handleLogin = async () => {
                try {
                    setError('');
                    setSuccess('');
                    
                    if (!formData.email || !formData.password) {
                        setError('Please enter email and password');
                        return;
                    }

                    console.log('Logging in:', formData.email);

                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: formData.email,
                        password: formData.password
                    });

                    if (error) {
                        console.error('Login error:', error);
                        throw error;
                    }

                    console.log('Login response:', data);

                    if (data.user) {
                        setUser(data.user);
                        setFormData({ name: '', email: '', password: '' });
                        setSuccess('Logged in successfully!');
                    }
                } catch (err) {
                    setError(err.message || 'Invalid email or password');
                }
            };

            const handleGoogleAuth = () => {
                const url = `https://accounts.google.com/o/oauth2/v2/auth?` +
                    `client_id=${GOOGLE_CLIENT_ID}` +
                    `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                    `&response_type=token` +
                    `&scope=${encodeURIComponent(SCOPES)}` +
                    `&access_type=offline` +
                    `&prompt=consent`;
                
                console.log('Redirecting to Google OAuth');
                window.location.href = url;
            };

            const loadClassroomData = async (token) => {
                try {
                    console.log('Loading classroom data...');
                    
                    const coursesRes = await fetch('https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (!coursesRes.ok) {
                        throw new Error('Failed to fetch courses');
                    }

                    const coursesData = await coursesRes.json();
                    console.log('Courses loaded:', coursesData.courses?.length || 0);
                    
                    if (coursesData.courses && coursesData.courses.length > 0) {
                        setCourses(coursesData.courses.map(c => ({
                            id: c.id,
                            name: c.name,
                            teacher: c.teacherFolder?.title || 'Teacher'
                        })));

                        const allAssignments = [];
                        for (const course of coursesData.courses) {
                            try {
                                const workRes = await fetch(
                                    `https://classroom.googleapis.com/v1/courses/${course.id}/courseWork`,
                                    { headers: { 'Authorization': `Bearer ${token}` } }
                                );
                                
                                if (workRes.ok) {
                                    const workData = await workRes.json();
                                    
                                    if (workData.courseWork) {
                                        workData.courseWork.forEach(w => {
                                            let due = null;
                                            if (w.dueDate) {
                                                due = `${w.dueDate.year}-${String(w.dueDate.month).padStart(2,'0')}-${String(w.dueDate.day).padStart(2,'0')}`;
                                            }
                                            allAssignments.push({
                                                id: w.id,
                                                courseId: course.id,
                                                courseName: course.name,
                                                title: w.title,
                                                description: w.description || 'No description provided',
                                                dueDate: due,
                                                status: 'pending',
                                                link: w.alternateLink
                                            });
                                        });
                                    }
                                }
                            } catch (e) {
                                console.error(`Error loading assignments for ${course.name}:`, e);
                            }
                        }
                        
                        allAssignments.sort((a,b) => {
                            if (!a.dueDate) return 1;
                            if (!b.dueDate) return -1;
                            return new Date(a.dueDate) - new Date(b.dueDate);
                        });
                        
                        setAssignments(allAssignments);
                        console.log('Assignments loaded:', allAssignments.length);
                    } else {
                        console.log('No courses found');
                    }
                } catch (err) {
                    console.error('Classroom load error:', err);
                    setError('Failed to load Google Classroom data. Please try reconnecting.');
                    localStorage.removeItem('google_token');
                    setHasGoogleAuth(false);
                }
            };

            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                localStorage.removeItem('google_token');
                setUser(null);
                setHasGoogleAuth(false);
                setCourses([]);
                setAssignments([]);
                setFormData({ name: '', email: '', password: '' });
            };

            const toggleComplete = (id) => {
                setAssignments(assignments.map(a =>
                    a.id === id ? { ...a, status: a.status === 'completed' ? 'pending' : 'completed' } : a
                ));
            };

            const filtered = selectedCourse === 'all' ? assignments : assignments.filter(a => a.courseId === selectedCourse);

            const getDaysUntil = (date) => {
                if (!date) return 999;
                const today = new Date();
                today.setHours(0,0,0,0);
                const due = new Date(date);
                due.setHours(0,0,0,0);
                return Math.ceil((due - today) / (1000*60*60*24));
            };

            const getColor = (days) => {
                if (days < 0) return 'bg-red-100 text-red-800';
                if (days === 0) return 'bg-orange-100 text-orange-800';
                if (days <= 2) return 'bg-orange-100 text-orange-800';
                if (days <= 5) return 'bg-yellow-100 text-yellow-800';
                return 'bg-green-100 text-green-800';
            };

            const getLabel = (days) => {
                if (days < 0) return `${Math.abs(days)}d overdue`;
                if (days === 0) return 'Due today';
                if (days === 1) return 'Due tomorrow';
                return `${days} days left`;
            };

            const stats = {
                total: assignments.length,
                pending: assignments.filter(a => a.status === 'pending').length,
                completed: assignments.filter(a => a.status === 'completed').length
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-xl text-gray-700">Loading Study Buddy...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="w-20 h-20 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <span className="text-white text-3xl font-bold">SB</span>
                                </div>
                                <h1 className="text-4xl font-bold text-gray-900 mb-2">Study Buddy</h1>
                                <p className="text-gray-600">Your Google Classroom companion</p>
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
                                    {error}
                                </div>
                            )}

                            {success && (
                                <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4 text-sm">
                                    {success}
                                </div>
                            )}

                            {showSignup ? (
                                <div className="space-y-4">
                                    <h2 className="text-2xl font-semibold mb-4">Create Account</h2>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            placeholder="John Doe"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input
                                            type="email"
                                            value={formData.email}
                                            onChange={(e) => setFormData({...formData, email: e.target.value})}
                                            className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            placeholder="you@example.com"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Password (min 6 characters)</label>
                                        <input
                                            type="password"
                                            value={formData.password}
                                            onChange={(e) => setFormData({...formData, password: e.target.value})}
                                            className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                    <button
                                        onClick={handleSignup}
                                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition"
                                    >
                                        Sign Up
                                    </button>
                                    <button
                                        onClick={() => {
                                            setShowSignup(false);
                                            setError('');
                                            setSuccess('');
                                        }}
                                        className="w-full text-indigo-600 py-2 text-sm hover:underline"
                                    >
                                        Already have an account? Log in
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <h2 className="text-2xl font-semibold mb-4">Log In</h2>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                        <input
                                            type="email"
                                            value={formData.email}
                                            onChange={(e) => setFormData({...formData, email: e.target.value})}
                                            onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                            className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            placeholder="you@example.com"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                        <input
                                            type="password"
                                            value={formData.password}
                                            onChange={(e) => setFormData({...formData, password: e.target.value})}
                                            onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                            className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            placeholder="••••••••"
                                        />
                                    </div>
                                    <button
                                        onClick={handleLogin}
                                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition"
                                    >
                                        Log In
                                    </button>
                                    <button
                                        onClick={() => {
                                            setShowSignup(true);
                                            setError('');
                                            setSuccess('');
                                        }}
                                        className="w-full text-indigo-600 py-2 text-sm hover:underline"
                                    >
                                        Don't have an account? Sign up
                                    </button>
                                </div>
                            )}
                            <div className="mt-6 text-center text-xs text-gray-500">
                                Free forever • No credit card required
                            </div>
                        </div>
                    </div>
                );
            }

            if (!hasGoogleAuth) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="w-20 h-20 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <span className="text-white text-3xl font-bold">SB</span>
                                </div>
                                <h1 className="text-2xl font-bold mb-2">Welcome, {user.user_metadata?.name || user.email}!</h1>
                                <p className="text-gray-600">Connect Google Classroom to see your assignments</p>
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">
                                    {error}
                                </div>
                            )}

                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
                                <h3 className="font-semibold text-blue-900 mb-2">What we'll access:</h3>
                                <ul className="text-sm text-blue-800 space-y-1">
                                    <li>• Your courses and class information</li>
                                    <li>• Assignment titles and due dates</li>
                                    <li>• Course materials</li>
                                </ul>
                                <p className="text-xs text-blue-700 mt-2">We never modify or delete your data</p>
                            </div>

                            <button
                                onClick={handleGoogleAuth}
                                className="w-full bg-white border-2 border-gray-300 py-3 px-4 rounded-lg font-semibold hover:bg-gray-50 flex items-center justify-center gap-3 transition"
                            >
                                <svg className="w-5 h-5" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Connect with Google Classroom
                            </button>

                            <button onClick={handleLogout} className="w-full text-gray-600 py-2 mt-4 text-sm hover:underline">
                                Log out
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-white shadow-sm border-b sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center">
                                    <span className="text-white font-bold">SB</span>
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-gray-900">Study Buddy</h1>
                                    <p className="text-xs text-gray-500">studybuddyapp.xyz</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 md:gap-4">
                                <span className="text-xs md:text-sm text-gray-600 hidden sm:block">{user.email}</span>
                                <button
                                    onClick={handleLogout}
                                    className="px-3 md:px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 text-xs md:text-sm font-medium"
                                >
                                    Logout
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-8">
                            <div className="bg-white rounded-xl shadow p-6">
                                <p className="text-gray-600 text-sm mb-1">Total</p>
                                <p className="text-3xl md:text-4xl font-bold text-gray-900">{stats.total}</p>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6">
                                <p className="text-gray-600 text-sm mb-1">Pending</p>
                                <p className="text-3xl md:text-4xl font-bold text-orange-600">{stats.pending}</p>
                            </div>
                            <div className="bg-white rounded-xl shadow p-6">
                                <p className="text-gray-600 text-sm mb-1">Completed</p>
                                <p className="text-3xl md:text-4xl font-bold text-green-600">{stats.completed}</p>
                            </div>
                        </div>

                        {courses.length > 0 && (
                            <div className="bg-white rounded-xl shadow p-4 mb-6">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Filter by Course</label>
                                <select
                                    value={selectedCourse}
                                    onChange={(e) => setSelectedCourse(e.target.value)}
                                    className="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg"
                                >
                                    <option value="all">All Courses ({assignments.length})</option>
                                    {courses.map(c => (
                                        <option key={c.id} value={c.id}>
                                            {c.name} ({assignments.filter(a => a.courseId === c.id).length})
                                        </option>
                                    ))}
                                </select>
                            </div>
                        )}

                        <div className="space-y-4">
                            <h2 className="text-xl font-bold text-gray-900">Your Assignments</h2>
                            {filtered.length === 0 ? (
                                <div className="bg-white rounded-xl shadow p-12 text-center">
                                    <div className="text-6xl mb-4">📚</div>
                                    <p className="text-gray-600 font-medium mb-2">No assignments found</p>
                                    <p className="text-sm text-gray-500">
                                        {assignments.length === 0 
                                            ? "Make sure you have assignments in Google Classroom with due dates set"
                                            : "Try selecting a different course filter"}
                                    </p>
                                </div>
                            ) : (
                                filtered.map(a => {
                                    const days = getDaysUntil(a.dueDate);
                                    return (
                                        <div key={a.id} className="bg-white rounded-xl shadow p-4 md:p-6 hover:shadow-lg transition">
                                            <div className="flex flex-col sm:flex-row items-start justify-between gap-4">
                                                <div className="flex-1 w-full">
                                                    <div className="flex items-center gap-3 mb-2">
                                                        <h3 className="text-base md:text-lg font-semibold text-gray-900">{a.title}</h3>
                                                        {a.status === 'completed' && (
                                                            <span className="text-green-600 text-xl">✓</span>
                                                        )}
                                                    </div>
                                                    <p className="text-sm text-indigo-600 font-medium mb-2">{a.courseName}</p>
                                                    <p className="text-sm md:text-base text-gray-700 mb-3">{a.description}</p>
                                                    {a.dueDate && (
                                                        <div className="flex items-center gap-3 flex-wrap mb-2">
                                                            <span className={`px-3 py-1 rounded-full text-xs md:text-sm font-medium ${getColor(days)}`}>
                                                                {getLabel(days)}
                                                            </span>
                                                            <span className="text-xs md:text-sm text-gray-600">
                                                                Due: {new Date(a.dueDate).toLocaleDateString()}
                                                            </span>
                                                        </div>
                                                    )}
                                                    {a.link && (
                                                        <a
                                                            href={a.link}
                                                            target="_blank"
                                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<StudyBuddy />, document.getElementById('root'));
    </script>
</body>
</html>
